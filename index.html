<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Patient Record | SMART Patient App</title>

<script src="https://cdn.jsdelivr.net/npm/fhirclient@3.0.1/bundle/fhir-client.js"></script>

<style>
:root{
  color-scheme: light;
  --page-bg:#f5f7fa;
  --card-bg:#ffffff;
  --border:#d7dde5;
  --text:#1b2733;
  --muted:#556474;
  --accent:#005a9c;
  --danger:#7a1b1b;
  --danger-bg:#fff3f3;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--page-bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:16px;
  line-height:1.5;
  padding:1rem;
}

main{
  width:min(100%,48rem);
  margin:auto;
}

.card{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:.75rem;
  padding:1.25rem;
  margin-bottom:1rem;
}

h1{
  margin:0;
  font-size:clamp(1.8rem,5vw,2.4rem);
}

h2{
  margin-top:0;
}

.subtitle{
  margin-top:.5rem;
  color:var(--muted);
}

.identity{
  display:grid;
  grid-template-columns:minmax(8rem,1fr) 2fr;
  gap:.75rem 1rem;
}

dt{
  font-weight:700;
}
