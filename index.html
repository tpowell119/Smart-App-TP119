<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patient record | SMART Patient App</title>

  <script src="https://cdn.jsdelivr.net/npm/fhirclient@3.0.1/bundle/fhir-client.js"></script>

  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #17212b;
      background: #f5f7fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 1.25rem;
      font-size: 1rem;
      line-height: 1.55;
    }

    .card {
      background: white;
      border: 1px solid #c7d0da;
      border-radius: 0.75rem;
      padding: 1.25rem;
    }
  </style>
</head>

<body>
  <main>
    <h1 id="page-title">Patient record</h1>

    <p id="loading" role="status">
      Loading your patient record…
    </p>

    <section id="signed-out" hidden>
      <h2>Sign in to view your record</h2>

      <ul>
        <li><a href="./launch.html">Sign in</a></li>
        <li><a href="./health.html">Health check</a></li>
      </ul>
    </section>

    <section id="record" hidden>
      <div class="card">
        <h2>Patient identity</h2>

        <dl>
          <dt>Name</dt>
          <dd id="name"></dd>

          <dt>Gender</dt>
          <dd id="gender"></dd>

          <dt>Birth date</dt>
          <dd id="birth-date"></dd>

          <dt>Age</dt>
          <dd id="age"></dd>
        </dl>
      </div>

      <section class="card">
        <h2>Recent results</h2>

        <dl>
          <dt>Height</dt>
          <dd><span id="height-value">Not recorded</span></dd>

          <dt>Blood pressure</dt>
          <dd><span id="blood-pressure-value">Not recorded</span></dd>

          <dt>HDL</dt>
          <dd><span id="hdl-value">Not recorded</span></dd>

          <dt>LDL</dt>
          <dd><span id="ldl-value">Not recorded</span></dd>
        </dl>
      </section>
    </section>
  </main>

  <script>
    FHIR.oauth2.ready()
      .then(function(client) {
        return client.patient.read()
          .then(function(patient) {
            showPatient(patient);
            return loadObservations(
              client,
              client.patient.id
            );
          });
      })
      .then(showResults)
      .catch(function(error) {
        console.error(error);
      });

    function loadObservations(client, patientId) {
      var params = new URLSearchParams();

      params.set("patient", patientId);

      params.set(
        "code",
        [
          "8302-2",
          "85354-9",
          "8480-6",
          "8462-4",
          "2085-9",
          "13457-7"
        ].join(",")
      );

      return client.request(
        "Observation?" + params.toString()
      );
    }

    function showPatient(patient) {
      document.getElementById("name").textContent =
        formatName(patient);

      document.getElementById("gender").textContent =
        patient.gender || "Not recorded";

      document.getElementById("birth-date").textContent =
        patient.birthDate || "Not recorded";

      document.getElementById("age").textContent =
        formatAge(patient.birthDate);

      document.getElementById("record").hidden = false;
    }
  </script>
</body>
</html>
