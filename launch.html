<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | SMART Patient App</title>

  <script src="https://cdn.jsdelivr.net/npm/fhirclient@3.0.1/bundle/fhir-client.js"></script>
</head>
<body>

  <main>
    <h1>Starting patient sign-in...</h1>

    <p>
      You are leaving this page for the SMART sandbox.
      Sign in as the patient, and the sandbox will return
      you to your patient record.
    </p>

    <p id="error"></p>
  </main>

  <script>
    // Patient standalone launch configuration for the SMART Health IT R4 sandbox.
    var launchOptions = [
      3, "", "", "AUTO",
      0, 0, 0,
      "", "", "", "", "", "", "",
      0, 1, ""
    ];

    var sandboxIss =
      "https://launch.smarthealthit.org/v/r4/sim/" +
      btoa(JSON.stringify(launchOptions))
        .replace(/=+$/g, "")
        .replace(/\+/g, "-")
        .replace(/\//g, "_") +
      "/fhir";

    FHIR.oauth2.authorize({
      clientId: "my_web_app",

      scope:
        "launch/patient openid fhirUser " +
        "patient/Patient.read " +
        "patient/Observation.read",

      redirectUri: "index.html",

      iss: sandboxIss
    })
    .catch(function (error) {
      document.querySelector("h1").textContent =
        "Could not start sign in";

      document.getElementById("error").textContent =
        error.message || String(error);
    });
  </script>

</body>
</html>
